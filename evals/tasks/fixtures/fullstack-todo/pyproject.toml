[project]
name = "fullstack-todo"
version = "0.1.0"
description = "Todo store and API service for CodeScout task evaluations"
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
