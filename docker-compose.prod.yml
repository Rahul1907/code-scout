# CodeScout: Production Docker Compose
# Architecture: 7 services (caddy, web, api, worker, agent, redis, docker-socket-proxy)
# Database: MongoDB Atlas free cluster via MONGODB_URI (no local mongo service)
# Host Ports: Only Caddy (80, 443) publishes ports to the host

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      INTERNAL_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      INTERNAL_API_URL: http://api:4000
      AGENT_SERVICE_URL: http://agent:8000
      REDIS_URL: redis://redis:6379
    volumes:
      - repos_data:/data/repos
      - ./secrets:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["node", "dist/workers/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      AGENT_SERVICE_URL: http://agent:8000
      REDIS_URL: redis://redis:6379
    volumes:
      - repos_data:/data/repos
      - ./secrets:/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  agent:
    build:
      context: ./services/agent
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      DOCKER_HOST: http://docker-socket-proxy:2375
      REDIS_URL: redis://redis:6379
    volumes:
      - repos_data:/data/repos
    depends_on:
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/internal/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      POST: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      BUILD: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  repos_data:
  redis_data:
  caddy_data:
  caddy_config:
