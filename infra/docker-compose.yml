services:
  mongo:
    image: mongodb/mongodb-atlas-local:latest
    hostname: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: code-scout-docker-proxy-1
    environment:
      CONTAINERS: "1"
      POST: "1"
      EXEC: "1"
      IMAGES: "1"
      INFO: "1"
      BUILD: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      AUTH: "0"
      SECRETS: "0"
      SWARM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    expose:
      - "2375"
    restart: unless-stopped

  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      DOCKER_HOST: http://docker-socket-proxy:2375
    expose:
      - "8000"
    volumes:
      - ../services/agent:/app
      - /app/.venv
      - ../evals:/app/evals
      - repos_data:/data/repos
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/internal/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: codescout-api:dev
    build:
      context: ../services/api
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
    volumes:
      - ../services/api:/app
      - /app/node_modules
      - repos_data:/data/repos
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    image: codescout-api:dev
    build:
      context: ../services/api
      dockerfile: Dockerfile
    command: ["pnpm", "worker:dev"]
    env_file:
      - ../.env
    volumes:
      - ../services/api:/app
      - /app/node_modules
      - repos_data:/data/repos
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    environment:
      INTERNAL_API_URL: http://api:4000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  repos_data:
  mongo_data:
  mongo_config:

