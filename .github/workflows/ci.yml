name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-ci:
    name: Agent Service (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --all-groups

      - name: Run Ruff Linter
        run: uv run ruff check app tests

      - name: Run Pytest Tests
        run: uv run pytest

  api-ci:
    name: API & Worker Service (Node.js 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Run Vitest Unit Tests
        run: pnpm test

  web-ci:
    name: Web Frontend (Next.js 15)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: TypeScript Typecheck
        run: pnpm run typecheck

      - name: Next.js Standalone Build
        run: pnpm run build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1

  build-arm64-images:
    name: Build ARM64 Docker Images
    needs: [agent-ci, api-ci, web-ci]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile.prod
          platforms: linux/arm64
          push: false

      - name: Build Agent Docker Image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: services/agent
          file: services/agent/Dockerfile.prod
          platforms: linux/arm64
          push: false

      - name: Build Web Docker Image (ARM64)
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile.prod
          platforms: linux/arm64
          push: false
