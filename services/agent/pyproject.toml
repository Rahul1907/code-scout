[project]
name = "codescout-agent"
version = "0.1.0"
description = "CodeScout Python FastAPI AI agent service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.58.0",
  "pathspec>=0.12.1",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pymongo>=4.10.0",
  "redis>=5.2.0",
  "tree-sitter>=0.23.0",
  "tree-sitter-language-pack>=0.4.0",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
